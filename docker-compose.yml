services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asa
      POSTGRES_PASSWORD: asa
      POSTGRES_DB: asa
    ports:
      - "5433:5432"
    volumes:
      - asa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asa -d asa"]
      interval: 5s
      timeout: 5s
      retries: 10

  opendata:
    build: https://github.com/alexandresousats/api-opendata.br.git
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  asa_pg:
